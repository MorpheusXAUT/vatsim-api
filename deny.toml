# https://github.com/EmbarkStudios/cargo-deny

[graph]
all-features = true

[advisories]
# Fail on any advisory. There are no blanket ignores on purpose: an ignore
# entry needs a comment saying why the advisory does not apply here.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# List of explicitly allowed licenses
# See https://spdx.org/licenses/ for list of possible licenses
# [possible values: any SPDX 3.11 short identifier (+ optional exception)].
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]
exceptions = [
    # Pulled in by reqwest's rustls stack under the `client` feature.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

# These appear in this crate's public API, so two copies in a consumer's
# dependency tree means two incompatible types with the same name. Keep them
# single-version here so the problem surfaces before a consumer hits it.
[[bans.deny]]
name = "chrono"
wrappers = []
deny-multiple-versions = true

[[bans.deny]]
name = "tokio"
wrappers = []
deny-multiple-versions = true

[[bans.deny]]
name = "reqwest"
wrappers = []
deny-multiple-versions = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
