[package]
name = "vatsim-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
description = "Rust types, async client, and mock server for various VATSIM APIs."
repository = "https://github.com/MorpheusXAUT/vatsim-api"
homepage = "https://github.com/MorpheusXAUT/vatsim-api"
keywords = ["vatsim", "flight-simulation", "aviation", "api"]
categories = ["api-bindings"]
readme = "README.md"

[features]
default = ["chrono", "serde"]
chrono = ["dep:chrono"]
client = ["serde", "dep:reqwest", "dep:serde_json", "dep:tokio"]
mock = [
    "chrono",
    "serde",
    "dep:axum",
    "dep:rust-embed",
    "dep:serde_json",
    "dep:tokio",
    "dep:tower-http",
]
mock-bin = ["mock", "tokio/rt-multi-thread", "tokio/macros"]
serde = ["chrono?/serde", "dep:serde"]
tracing = ["axum?/tracing", "tower-http?/trace", "dep:tracing"]

[[bin]]
name = "vatsim-mock"
required-features = ["mock-bin"]

[dependencies]
thiserror = "2"

axum = { version = "0.8", optional = true }
chrono = { version = "0.4", optional = true }
reqwest = { version = "0.13", features = ["json", "query"], optional = true }
rust-embed = { version = "8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = [
    "rt",
    "time",
    "sync",
    "net",
], optional = true }
tower-http = { version = "0.6", features = [
    "cors",
    "fs",
    "set-header",
], optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
