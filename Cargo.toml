[package]
name = "vatsim-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
description = "Rust types, async client, and mock server for various VATSIM APIs."
repository = "https://github.com/MorpheusXAUT/vatsim-api"
homepage = "https://github.com/MorpheusXAUT/vatsim-api"
documentation = "https://docs.rs/vatsim-api"
keywords = ["vatsim", "flight-simulation", "aviation", "api", "mock"]
categories = [
    "api-bindings",
    "development-tools::testing",
    "network-programming",
    "simulation",
]
readme = "README.md"
# Allowlist rather than `exclude`, so a new top-level file does not ship
# unless it is added here deliberately.
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[features]
default = ["chrono", "serde"]
chrono = ["dep:chrono"]
client = ["serde", "dep:reqwest", "dep:serde_json", "dep:tokio"]
mock = [
    "chrono",
    "serde",
    "dep:axum",
    "dep:serde_json",
    "dep:tokio",
    "dep:tower-http",
    "dep:url",
]
mock-bin = [
    "mock",
    "tracing",
    "dep:clap",
    "dep:tracing-subscriber",
    "tokio/rt-multi-thread",
    "tokio/macros",
    "tokio/signal",
]
serde = ["chrono?/serde", "dep:serde"]
tracing = ["axum?/tracing", "tower-http?/trace", "dep:tracing"]

[[bin]]
name = "vatsim-mock"
required-features = ["mock-bin"]

[dependencies]
thiserror = "2"

axum = { version = "0.8", optional = true }
chrono = { version = "0.4", optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
reqwest = { version = "0.13", features = ["json", "query"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = [
    "rt",
    "time",
    "sync",
    "net",
], optional = true }
tower-http = { version = "0.7", features = [
    "cors",
    "set-header",
], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
], optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
reqwest = { version = "0.13", features = ["form", "json"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
